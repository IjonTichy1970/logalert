# /etc/wsl.conf for the SANDBOX distro. Apply with `wsl --terminate <distro>` from Windows;
# WSL reads this file at distro start. Back up the original first.

[boot]
systemd=true

[user]
default=me

# Windows drives are mounted READ-ONLY in this sandbox.
#
# This is a mechanism, not a policy: `ro` is a VFS mount flag, so it stops root
# too -- unlike permission bits or a umask, which root ignores. The sandbox can
# still READ the checkout under /mnt/<drive>/ to validate real artifacts, but
# nothing in here can write to the Windows filesystem, including other repos
# and C:\Users\<you>\.claude.
[automount]
enabled=true
options="ro"
