name: CI

# paths-ignore: a docs-only change spends no CI. GitHub skips only when EVERY changed file
# matches, so a mixed change or a version-bump commit still runs. A docs-only PR therefore shows
# NO checks -- treat that as could-not-check, not green: the local gate (which does check the
# markdown width and the changelog refs) stands in, and `git diff --name-only main..HEAD` must
# be docs-only before merging.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The linux stage of the gate: a skip is a FAILURE here. Nothing sets this for you; without
      # it CI runs that stage in auto mode and passes by not looking.
      LOGALERT_CHECK_MODE: required
    strategy:
      matrix:
        # MUST mirror the "Programming Language :: Python :: 3.x" classifiers in pyproject.toml
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog-refs stage reads history back to the last release commit. On the
          # default one-commit shallow clone it measures nothing and exits 2 (could not check),
          # which the gate reports as red.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # THE ONLY COPY of the gate. Every stage, exit code read directly.
      - run: bash tools/gate.sh
