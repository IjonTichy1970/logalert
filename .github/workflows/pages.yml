name: Pages

# The changelog site: CHANGELOG.md rendered by tools/render_changelog.py to site/index.html and
# published with GitHub Pages (Settings -> Pages -> Source = "GitHub Actions"). The `build` job
# ALWAYS runs -- no paths filter: every batch PR touches CHANGELOG.md, and a docs-only PR (which
# ci.yml skips) then still carries one check, the renderer's structural gate (an untagged entry,
# a second "### Nitty Gritty", a malformed version heading each fail it). `deploy` runs only for
# a push to main.
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      # The renderer exits 1 on a structural defect and 2 when it could not read the file;
      # both fail the job. The same parse runs in the gate (`changelog structure` stage).
      - run: python tools/render_changelog.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
      contents: read
    # One deploy at a time, never cancelled part-way: a half-published site is worse than a
    # late one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
