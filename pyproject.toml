[build-system]
requires = ["setuptools>=77"]          # floor for SPDX license-expression support
build-backend = "setuptools.build_meta"

[project]
name = "logalert"
version = "0.1.0"
description = "Generalized log file watcher."
readme = "README.md"
requires-python = ">=3.11"             # the measured floor (#53); 3.10 lacks datetime.UTC
license = "MIT"                        # PEP 639 SPDX string; no License:: classifier (deprecated)
license-files = ["LICENSE"]
authors = [{ name = "IjonTichy1970" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",       # what CI tests (the classifier rule in CLAUDE.md)
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",   # MUST mirror the CI matrix in .github/workflows/ci.yml
    "Programming Language :: Python :: 3.12",   # (tests/test_install_doc.py pins the three together)
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
# What the gate (tools/gate.sh) needs installed into the venv; never runtime. On this Windows
# dev host mypy's compiled wheel is blocked by an Application Control policy -- install it as
# `pip install --no-binary mypy mypy` there (pure Python, slower, same verdicts).
dev = ["ruff>=0.5", "mypy>=1.10", "pytest>=8", "build>=1"]
# The changelog site (tools/render_changelog.py, .github/workflows/pages.yml): `markdown` renders
# the entries' text; `types-Markdown` is its stubs for mypy --strict (the package ships none).
# `--check` needs neither (the gate's `changelog structure` stage runs on `dev` alone), but the
# gate's mypy stage and the render test do: a dev venv is `.[dev,docs]`, as is CI's.
docs = ["markdown>=3.5", "types-Markdown"]

[project.urls]
Homepage = "https://github.com/IjonTichy1970/logalert"
Changelog = "https://github.com/IjonTichy1970/logalert/blob/main/CHANGELOG.md"
Releases = "https://github.com/IjonTichy1970/logalert/releases"

[project.scripts]
logalert = "logalert.__main__:main"

[tool.setuptools.packages.find]
include = ["logalert*"]

[tool.setuptools.package-data]
"logalert.data" = ["*.example"]   # the shipped example config (`logalert --example-config`)

[tool.ruff]
target-version = "py311"   # the floor: the UP rules must not propose 3.12-only rewrites
line-length = 100
# `.claude/` is agent tooling: it carries the rich (emoji) style and shell-shaped strings that a
# style tool would mangle. It is gated by BEHAVIOUR instead -- each hook's test is its own gate
# stage. `.venv/` for the obvious reason.
extend-exclude = [".claude", ".venv"]

[tool.ruff.lint]
# RUF100 (an unused `# noqa`) and RUF102 (a code ruff does not know): a stale suppression is
# one nobody can account for, and a planted `# noqa: XYZ999` passed the gate in silence
# before they were selected (issue #48)
select = ["E", "F", "W", "I", "B", "UP", "PLW1510", "S", "RUF100", "RUF102"]
ignore = ["S603", "S607"]  # subprocess with a fixed argv and a resolved executable is the point
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are what tests are made of

[tool.mypy]
strict = true
# The floor's typeshed on every host (#53): the dev venv is 3.12, and without this a 3.12-only
# API (`typing.override`, `itertools.batched`) passed the host's mypy and failed CI's 3.11 leg.
# The cost: a `sys.version_info >= (3, 12)` branch would go unchecked; none exists.
python_version = "3.11"
exclude = ['^\.claude/', '^\.venv/']

[tool.pytest.ini_options]
# A GUARD, not a convenience. pytest's default `norecursedirs` (which includes `.*`) is the only
# thing keeping `.claude/` out of root discovery; `testpaths` makes the scope explicit so the
# exclusion does not depend on a default. If you ever override `norecursedirs`, keep this line:
# the override drops the `.*` default, and the script-style hook test under `.claude/hooks/` would
# then be IMPORTED at collection -- running its subprocess checks and possibly `sys.exit(1)`.
# It yields zero test ids, so you cannot detect that by grepping collected tests; detect it by
# collection DURATION.
testpaths = ["tests"]
addopts = "-ra"

[tool.bandit]
exclude_dirs = [".claude", ".venv", "tests"]
